name: Keep Alive
on:
  schedule:
    # At 00:00 on day-of-month 1.
    - cron: "0 0 1 * *"
permissions:
  actions: write
jobs:
  cronjob-based-github-action:
    name: Cronjob based github action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # - steps
      - uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
